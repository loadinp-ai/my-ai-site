<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading... Please Wait</title>
<style>
  :root {
    --bg: #000000;
    --accent: #00d4ff;
    --text-dim: #888888;
    --border-width: 4px;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--accent);
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }

  /* --- Edge loading bar --- */
  /* Four bars, one per side, that fill in sequence around the viewport */
  .edge-loader {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
  }

  .edge-loader.active { opacity: 1; }

  .edge-loader span {
    position: absolute;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
  }

  .edge-loader .top {
    top: 0; left: 0;
    height: var(--border-width);
    width: 0%;
    animation: growRight 0.4s linear forwards;
  }
  .edge-loader .right {
    top: 0; right: 0;
    width: var(--border-width);
    height: 0%;
    animation: growDown 0.4s linear 0.4s forwards;
  }
  .edge-loader .bottom {
    bottom: 0; right: 0;
    height: var(--border-width);
    width: 0%;
    animation: growLeft 0.4s linear 0.8s forwards;
  }
  .edge-loader .left {
    bottom: 0; left: 0;
    width: var(--border-width);
    height: 0%;
    animation: growUp 0.4s linear 1.2s forwards;
  }

  @keyframes growRight { from { width: 0%; } to { width: 100%; } }
  @keyframes growDown  { from { height: 0%; } to { height: 100%; } }
  @keyframes growLeft  { from { width: 0%; } to { width: 100%; } }
  @keyframes growUp    { from { height: 0%; } to { height: 100%; } }

  /* --- Initial spinner (kept from original) --- */
  .loader {
    border: 4px solid #1a1a1a;
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  h1 {
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  p {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 0;
    margin-bottom: 2rem;
  }

  /* --- Link list --- */
  .links {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .links a {
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 0.6rem 1.5rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.85rem;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .links a:hover {
    background: var(--accent);
    color: #000000;
  }
</style>
</head>
<body>

  <div class="edge-loader" id="edgeLoader">
    <span class="top"></span>
    <span class="right"></span>
    <span class="bottom"></span>
    <span class="left"></span>
  </div>

  <div class="loader"></div>
  <h1>Loading...</h1>
  <p>Site optimization in progress for loadinpleasewait.com</p>

  <div class="links">
    <a href="https://www.youtube.com" data-link>YouTube</a>
    <a href="https://www.facebook.com" data-link>Facebook</a>
  </div>

  <script>
    // Play the edge-loading-bar animation whenever a link is clicked,
    // then navigate once the animation finishes.
    const edgeLoader = document.getElementById('edgeLoader');
    document.querySelectorAll('a[data-link]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const destination = link.href;
        edgeLoader.classList.add('active');
        setTimeout(function () {
          window.location.href = destination;
        }, 1700); // matches total animation time (4 sides x 0.4s + stagger)
      });
    });
  </script>

</body>
</html>
