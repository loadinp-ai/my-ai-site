<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... Please Wait</title>
    <style>
        body { background: #0a0a0a; color: #00d4ff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #00d4ff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { letter-spacing: 5px; text-transform: uppercase; }
        p { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Loading...</h1>
    <p>Site optimization in progress for loadinpleasewait.com</p>
</body>
</html>
